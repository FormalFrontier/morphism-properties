version: "v0.4"

project:
  name: Morphism Properties
  description: >-
    Relative preservation of maps between pullbacks, canonical transport
    between structured over-categories, and pullback pairing over a fixed base,
    using Mathlib's morphism properties.
    See README.md for hypotheses and limitations.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

sources:
  - title: "Foundations of Rigid Geometry I"
    authors:
      - Kazuhiro Fujiwara
      - Fumiharu Kato
    type: book
    location: "arXiv:1308.4734v5, Chapter 0, section 1.4(a), Proposition 1.4.1"
    relationship: background
    note: >-
      Motivation for relative preservation and the first B2 object-structured
      alternative, generalized to a fixed base arrow and a fixed-base pairing.
      This is not the full B1/B2 package, converse, adjunction or creation of
      structured pullbacks.
  - title: Mathlib
    authors:
      - The mathlib community
    type: software
    location: "https://github.com/leanprover-community/mathlib4"
    relationship: adapts
    note: >-
      Uses morphism-property stability and cancellation, pullback pasting and
      lifts, comma categories, the existing structured-over pullback functor,
      pointwise pullback-cone assembly and the ordinary over-category lift.
      Andrew Yang and Joel Riou's formalization credit is preserved in the code.

status:
  scope: >-
    Three modules: generic relative pullback-map preservation and the either-leg
    criterion for existing squares; structured-over transport with projection,
    membership, extensionality, uniqueness and comparison APIs; and a fixed-base
    pullback pairing with independent object properties, selected-pair existence
    and relative horizontal preservation. Constructed examples use three- and
    four-object chains, nonempty finite subsets and proper finite-type maps,
    including local existence boundaries and an asymmetric nonisomorphic pairing.
  main_results:
    - declaration: CategoryTheory.MorphismProperty.isStableUnderBaseChange_either_iff
      file: MorphismProperties/RelativeBaseChange.lean
    - declaration: CategoryTheory.MorphismProperty.pullbackLift_fst_snd_of_intersection_of_postcomp
      file: MorphismProperties/RelativeBaseChange.lean
    - declaration: CategoryTheory.MorphismProperty.Over.pullbackOfIntersectionOfPostcomp
      file: MorphismProperties/OverPullback.lean
    - declaration: CategoryTheory.MorphismProperty.Over.pullbackPairing_map_mem_of_relative
      file: MorphismProperties/PullbackPairing.lean

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formal Frontier AI agents assisted with Lean formalization, examples,
        package configuration and documentation using Mathlib.

review:
  status: "Under development"
  notes: >-
    The library covers relative preservation, fixed-base-arrow structured-over
    transport and fixed-base pairing, not the full B1/B2 package, converse,
    adjunction or creation of structured pullbacks.
